<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrinho - Game Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f0f1a;
            color: white;
        }

        header {
            background: #17172b;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #6c2cff;
        }

        header h1 {
            color: #8b5cf6;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #8b5cf6;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        h2 {
            margin-bottom: 30px;
            font-size: 32px;
        }

        .carrinho {
            background: #191927;
            padding: 25px;
            border-radius: 15px;
        }

        .produto {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #333;
        }

        .produto img {
            width: 100px;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
        }

        .produto-info {
            flex: 1;
        }

        .produto-info h3 {
            margin-bottom: 10px;
        }

        .produto-info p {
            color: #aaa;
        }

        .preco {
            color: #8b5cf6;
            font-size: 20px;
            font-weight: bold;
        }

        .remover {
            background: #e63946;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        .remover:hover {
            background: #ff4d5a;
        }

        .total {
            text-align: right;
            margin-top: 25px;
        }

        .total h3 {
            font-size: 26px;
            margin-bottom: 20px;
        }

        .finalizar {
            background: #6c2cff;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        .finalizar:hover {
            background: #8b5cf6;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #17172b;
            color: #aaa;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            .produto {
                flex-wrap: wrap;
            }

            .total {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🎮 Game Store</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="carrinho.html">🛒 Carrinho</a>
        </nav>
    </header>

    <main class="container">

        <h2>🛒 Meu Carrinho</h2>

        <section class="carrinho">

            <div class="produto">

                <img
                    src="https://placehold.co/600x800/201050/ffffff?text=Cyber+War"
                    alt="Cyber War">

                <div class="produto-info">
                    <h3>Cyber War</h3>
                    <p>PC • Jogo digital</p>
                </div>

                <div class="preco">
                    R$ 149,90
                </div>

                <button class="remover">
                    Remover
                </button>

            </div>


            <div class="produto">

                <img
                    src="https://placehold.co/600x800/502010/ffffff?text=Speed+Racing"
                    alt="Speed Racing">

                <div class="produto-info">
                    <h3>Speed Racing</h3>
                    <p>PC • Jogo digital</p>
                </div>

                <div class="preco">
                    R$ 99,90
                </div>

                <button class="remover">
                    Remover
                </button>

            </div>


            <div class="total">

                <h3>
                    Total: R$ 249,80
                </h3>

                <button class="finalizar">
                    Finalizar compra
                </button>

            </div>

        </section>

    </main>

    <footer>
        © 2026 Game Store - Todos os direitos reservados.
    </footer>

</body>
</html>
